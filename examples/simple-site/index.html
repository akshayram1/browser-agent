<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Site — OmniBrowser Agent</title>
  <link rel="icon" type="image/png" href="../../icons/logo_horizontal.png" />
  <style>
    :root { --bg:#0a0d12; --card:#0f1319; --b:rgba(255,255,255,.08); --t:#e4e7ed; --m:#6b7280; --g:#00e5a0; --mono:'Menlo','Consolas',monospace; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}

    /* header */
    header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--b)}
    header img{height:34px}
    header a{color:var(--m);font-size:12px;text-decoration:none}
    header a:hover{color:var(--t)}

    /* page */
    .page{max-width:720px;margin:0 auto;padding:28px 20px 120px}
    h1{font-size:20px;font-weight:700;margin-bottom:4px}
    .sub{color:var(--m);font-size:13px;margin-bottom:24px}

    /* card */
    .card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px}
    .card h2{font-size:15px;font-weight:700;margin-bottom:12px}

    /* form */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid .full{grid-column:1/-1}
    label{display:block;font-size:11px;font-weight:600;color:var(--m);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
    input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:rgba(255,255,255,.03);color:var(--t);font-size:13px;font-family:inherit;outline:none}
    input:focus,textarea:focus{border-color:rgba(0,229,160,.4)}
    textarea{resize:vertical;min-height:50px}
    select option{background:#0f1319}

    /* buttons */
    .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
    .btn:disabled{opacity:.35;cursor:not-allowed}
    .btn-primary{background:var(--g);color:#000}
    .btn-ghost{background:rgba(255,255,255,.05);color:var(--m);border:1px solid var(--b)}
    .btn-ghost:hover:not(:disabled){color:var(--t);border-color:rgba(255,255,255,.15)}

    /* search */
    .search-row{display:flex;gap:8px}
    .search-row input{flex:1}

    /* table */
    table{width:100%;border-collapse:collapse}
    th{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--m);padding:8px;text-align:left;border-bottom:1px solid var(--b)}
    td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
    .tbl-btn{padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid var(--b);background:transparent;color:var(--m);cursor:pointer}
    .tbl-btn:hover{color:var(--g);border-color:rgba(0,229,160,.3)}

    /* profile */
    .profile{display:none;margin-top:12px;padding:14px;border-radius:8px;background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.15)}
    .profile.open{display:block}
    .profile h3{color:var(--g);font-size:15px;margin-bottom:4px}
    .profile p{color:var(--m);font-size:13px}

    /* result msg */
    .msg{display:none;margin-top:10px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}
    .msg.ok{display:block;background:rgba(34,197,94,.07);color:#22c55e;border:1px solid rgba(34,197,94,.2)}
    .msg.err{display:block;background:rgba(239,68,68,.07);color:#ef4444;border:1px solid rgba(239,68,68,.2)}

    /* ── Agent Bar (sticky bottom) ── */
    .agent-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,19,25,.96);backdrop-filter:blur(12px);border-top:1px solid var(--b);padding:10px 20px;z-index:100}
    .agent-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
    .agent-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .agent-input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:rgba(255,255,255,.03);color:var(--t);font-size:13px;outline:none}
    .agent-input:focus{border-color:rgba(0,229,160,.4)}
    .run-btn{padding:8px 18px;background:var(--g);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
    .run-btn:disabled{opacity:.35;cursor:not-allowed}
    .chip-row{display:flex;gap:5px;flex-wrap:wrap}
    .chip{padding:3px 10px;border:1px solid var(--b);border-radius:99px;font-size:11px;color:var(--m);cursor:pointer;background:transparent;font-family:inherit}
    .chip:hover{color:var(--g);border-color:rgba(0,229,160,.3)}
    .agent-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--m);font-family:var(--mono)}
    .agent-meta select{width:auto;font-size:11px;padding:4px 6px;font-family:var(--mono)}
    .sdot{width:6px;height:6px;border-radius:50%;background:var(--m);flex-shrink:0}
    .sdot.on{background:var(--g)}
    .sdot.loading{background:#f59e0b;animation:p 1s infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
    .agent-log{font-family:var(--mono);font-size:10.5px;color:var(--m);max-height:60px;overflow-y:auto;line-height:1.5}
    .agent-log span{display:block}

    /* approval */
    .approval{display:none;padding:8px 12px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:8px;font-size:12px;color:#f59e0b}
    .approval.on{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .approval button{padding:5px 12px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
    .ap-yes{background:rgba(34,197,94,.15);color:#22c55e}
    .ap-no{background:rgba(239,68,68,.1);color:#ef4444}

    /* flash */
    .agent-act{outline:2px solid var(--g)!important;outline-offset:2px;transition:outline-color .3s}

    @media(max-width:600px){.grid{grid-template-columns:1fr}.agent-row{flex-direction:column}.agent-input{width:100%}}
  </style>
</head>
<body>

<header>
  <a href="../../"><img src="../../icons/logo_horizontal.png" alt="OmniBrowser Agent" /></a>
  <div style="display:flex;gap:12px">
    <a href="../chatbot">Chatbot Demo</a>
    <a href="../../">Docs</a>
  </div>
</header>

<div class="page" id="page-root">

  <h1>Simple Demo Site</h1>
  <p class="sub">A basic page the OmniBrowser Agent can interact with. Use the bar below to give it goals.</p>

  <!-- Search -->
  <div class="card">
    <h2>Search Contacts</h2>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search by name or company..." />
      <button class="btn btn-primary" id="search-btn">Search</button>
    </div>
    <div id="search-status" style="margin-top:6px;font-size:12px;color:var(--m);display:none"></div>
  </div>

  <!-- Contacts -->
  <div class="card">
    <h2>Contacts <span id="count" style="font-weight:400;color:var(--m);font-size:13px"></span></h2>
    <table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="profile" id="profile">
      <h3 id="p-name"></h3>
      <p id="p-email"></p>
      <p id="p-company"></p>
    </div>
  </div>

  <!-- Add Contact -->
  <div class="card">
    <h2>Add Contact</h2>
    <div class="grid">
      <div><label for="name">Name</label><input type="text" id="name" placeholder="e.g. Alex Morgan" /></div>
      <div><label for="email">Email</label><input type="email" id="email" placeholder="alex@example.com" /></div>
      <div><label for="phone">Phone</label><input type="tel" id="phone" placeholder="+1 555 000 0000" /></div>
      <div><label for="company">Company</label><input type="text" id="company" placeholder="Acme Inc." /></div>
      <div class="full"><label for="notes">Notes</label><textarea id="notes" placeholder="Any notes..."></textarea></div>
    </div>
    <button class="btn btn-primary" id="submit-btn" style="margin-top:12px;width:100%">Submit Contact</button>
    <div class="msg" id="msg"></div>
  </div>

</div>

<!-- ── Agent Bar ── -->
<div class="agent-bar" data-agent-exclude>
  <div class="agent-inner">
    <div class="chip-row">
      <button class="chip" data-goal="Search for Jane Doe">Search Jane</button>
      <button class="chip" data-goal="Fill the name field with Jane Doe">Fill name</button>
      <button class="chip" data-goal="Fill the email with jane@example.com">Fill email</button>
      <button class="chip" data-goal="Click the Submit Contact button">Submit</button>
      <button class="chip" data-goal="Open Jane Doe profile">Open profile</button>
    </div>
    <div class="agent-row">
      <input type="text" class="agent-input" id="goal" placeholder="Give the agent a goal..." />
      <button class="run-btn" id="run-btn">Run</button>
    </div>
    <div class="approval" id="approval">
      <span id="approval-text">Approval needed</span>
      <button class="ap-yes" id="ap-yes">Approve</button>
      <button class="ap-no" id="ap-no">Reject</button>
    </div>
    <div class="agent-meta">
      <select id="mode"><option value="human-approved">Human-approved</option><option value="autonomous">Autonomous</option></select>
      <select id="model">
        <option value="Mistral-7B-Instruct-v0.3-q4f16_1-MLC" selected>Mistral 7B</option>
        <option value="omnibrowser-planner-1p5b-q4f16_1">OmniBrowser 1.5B</option>
        <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B</option>
        <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5 Mini</option>
        <option value="Qwen2.5-7B-Instruct-q4f16_1-MLC">Qwen2.5 7B</option>
      </select>
      <button class="btn btn-ghost" id="load-btn" style="padding:4px 12px;font-size:11px">Load AI</button>
      <div class="sdot" id="sdot"></div>
      <span id="status">heuristic</span>
    </div>
    <div class="agent-log" id="log"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
